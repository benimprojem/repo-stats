<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repo İstatistikleri</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 20px;
      color: #58a6ff;
    }

    .header {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input {
      flex: 1 1 260px;
      max-width: 320px;
      min-width: 220px;
      padding: 10px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 14px;
    }

    button {
      padding: 10px 18px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: #2ea043; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-left: 4px solid #58a6ff;
      border-radius: 10px;
      padding: 18px 16px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .summary-label {
      color: #8b949e;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .summary-value {
      color: #79c0ff;
      font-size: clamp(22px, 2vw, 30px);
      font-weight: 700;
      line-height: 1.2;
    }

    .repos-wrap {
      overflow-x: auto;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
    }

    .repos-table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    .repos-table th {
      text-align: left;
      padding: 14px 16px;
      background: #0d1117;
      color: #8b949e;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #30363d;
    }

    .repos-table td {
      padding: 14px 16px;
      border-top: 1px solid #30363d;
      font-size: 14px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .repo-name {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
    }

    .repo-name:hover { text-decoration: underline; }

    .stat-number {
      text-align: center;
      color: #79c0ff;
      font-weight: 600;
    }

    .loading, .empty {
      text-align: center;
      padding: 26px;
      color: #8b949e;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      margin-top: 12px;
    }

    .error {
      background: #da3633;
      color: white;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    @media (max-width: 980px) {
      .summary {
        grid-template-columns: repeat(3, minmax(160px, 1fr));
      }
    }

    @media (max-width: 720px) {
      .summary {
        grid-template-columns: repeat(2, minmax(150px, 1fr));
      }
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .summary {
        grid-template-columns: 1fr;
      }
      .header {
        flex-direction: column;
        align-items: stretch;
      }
      input, button {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 GitHub Repo İstatistikleri</h1>

    <div class="header">
      <input id="username" value="benimprojem" placeholder="GitHub kullanıcı adı" />
      <button onclick="loadStats()">Yükle</button>
    </div>

    <div id="error"></div>
    <div id="loading" class="loading" style="display:none;">⏳ Yükleniyor...</div>

    <div id="summary" class="summary"></div>

    <div class="repos-wrap">
      <table class="repos-table" id="repos" style="display:none;">
        <thead>
          <tr>
            <th>Repo Adı</th>
            <th>⭐ Star</th>
            <th>🍴 Fork</th>
            <th>📋 Issue</th>
            <th>📥 Clone</th>
            <th>📅 Son Update</th>
          </tr>
        </thead>
        <tbody id="repos-body"></tbody>
      </table>
    </div>

    <div id="empty" class="empty" style="display:none;">Repo bulunamadı</div>
  </div>

  <script>
    async function loadStats() {
      const username = document.getElementById("username").value.trim();
      if (!username) {
        alert("Lütfen GitHub kullanıcı adı giriniz.");
        return;
      }

      const errorEl = document.getElementById("error");
      const loadingEl = document.getElementById("loading");
      const summaryEl = document.getElementById("summary");
      const reposEl = document.getElementById("repos");
      const reposBodyEl = document.getElementById("repos-body");
      const emptyEl = document.getElementById("empty");

      errorEl.innerHTML = "";
      loadingEl.style.display = "block";
      summaryEl.innerHTML = "";
      reposEl.style.display = "none";
      emptyEl.style.display = "none";

      try {
        const res = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`);
        if (!res.ok) throw new Error("Kullanıcı bulunamadı.");

        let repos = await res.json();
        repos = repos.filter(r => !r.fork);

        if (repos.length === 0) {
          emptyEl.style.display = "block";
          loadingEl.style.display = "none";
          return;
        }

        const reposWithStats = await Promise.all(
          repos.map(async (repo) => {
            let clones = 0;
            try {
              const trafficRes = await fetch(`https://api.github.com/repos/${username}/${repo.name}/traffic/clones`, {
                headers: { Accept: "application/vnd.github.v3+json" }
              });
              if (trafficRes.ok) {
                const trafficData = await trafficRes.json();
                clones = Number(trafficData.count || 0);
              }
            } catch (e) {
              clones = 0;
            }

            return {
              name: repo.name,
              url: repo.html_url,
              stars: repo.stargazers_count,
              forks: repo.forks_count,
              issues: repo.open_issues_count,
              clones,
              updated: new Date(repo.updated_at).toLocaleDateString("tr-TR")
            };
          })
        );

        const totalStars = reposWithStats.reduce((sum, r) => sum + r.stars, 0);
        const totalForks = reposWithStats.reduce((sum, r) => sum + r.forks, 0);
        const totalIssues = reposWithStats.reduce((sum, r) => sum + r.issues, 0);
        const totalClones = reposWithStats.reduce((sum, r) => sum + r.clones, 0);

        summaryEl.innerHTML = `
          <div class="summary-card">
            <div class="summary-label">Toplam Repo</div>
            <div class="summary-value">${reposWithStats.length}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">⭐ Star</div>
            <div class="summary-value">${totalStars}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">🍴 Fork</div>
            <div class="summary-value">${totalForks}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">📋 Issue</div>
            <div class="summary-value">${totalIssues}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">📥 Clone</div>
            <div class="summary-value">${totalClones}</div>
          </div>
        `;

        reposBodyEl.innerHTML = reposWithStats
          .sort((a, b) => b.stars - a.stars)
          .map(repo => `
            <tr>
              <td><a class="repo-name" href="${repo.url}" target="_blank">${repo.name}</a></td>
              <td class="stat-number">${repo.stars}</td>
              <td class="stat-number">${repo.forks}</td>
              <td class="stat-number">${repo.issues}</td>
              <td class="stat-number">${repo.clones}</td>
              <td>${repo.updated}</td>
            </tr>
          `).join("");

        reposEl.style.display = "table";
      } catch (error) {
        errorEl.innerHTML = `<div class="error">❌ ${error.message}</div>`;
      } finally {
        loadingEl.style.display = "none";
      }
    }

    window.onload = loadStats;
  </script>
</body>
</html>
